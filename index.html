<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container">

    <p class="roundMsg hidden"></p>
    <p class="resaultsMsg hidden"></p>
    <p class="playerPoints hidden"></p>

    <button id="startBtn" class="Btn">Start Game</button>

    <div class="choiceBtns hidden">
      <button data-choice="paper" >📄</button>
      <button data-choice="rock" >🪨</button>
      <button data-choice="scissors" >✂️</button>
    </div>

    <p class="victoryMsgText"></p>

    <button class="Btn hidden" id="restartBtn">Play Again!</button>

  </div>
</body>
</html>
